<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Signup - Book Haven</title>
    <link rel="stylesheet" href="style.css">       <!-- Reusing main styles -->
    <link rel="stylesheet" href="auth.css">
    <!-- Font Awesome for social icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <!-- Navigation Bar (Simplified for focus, or can be kept) -->
    <header>
        <nav class="navbar">
            <div class="nav-left">
                <a href="index.html" class="logo">Book Haven</a>
            </div>
            <div class="nav-right">
                <a href="cart.html" class="nav-link cart-icon" aria-label="Cart">
                    <img src="cart-bag.svg" alt="" class="cart-button-img">
                    <span class="cart-label">Cart</span>
                    <span class="cart-count">0</span>
                </a>
            </div>
        </nav>
    </header>

    <main>
        <div class="auth-container">
            <div class="auth-box">
                <div class="auth-header">
                    <h2>Welcome to Book Haven</h2>
                    <p>Your journey into a world of books starts here.</p>
                </div>

                <!-- Toggle Buttons -->
                <div class="auth-toggle">
                    <button id="login-toggle-btn" class="toggle-btn active">Login</button>
                    <button id="signup-toggle-btn" class="toggle-btn">Sign Up</button>
                </div>

                <!-- Login Form -->
                <form id="login-form" class="auth-form active">
                    <h3>Login to Your Account</h3>
                    <div class="form-group">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" placeholder="Enter your email">
                        <small class="error-message" id="login-email-error"></small>
                    </div>
                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" placeholder="Enter your password">
                        <small class="error-message" id="login-password-error"></small>
                    </div>
                    <div class="form-options">
                        <a href="#" class="forgot-password">Forgot Password?</a>
                    </div>
                    <button type="submit" class="submit-btn">Login</button>
                </form>

                <!-- Signup Form -->
                <form id="signup-form" class="auth-form">
                    <h3>Create Your Account</h3>
                    <div class="form-group">
                        <label for="signup-name">Full Name</label>
                        <input type="text" id="signup-name" placeholder="Enter your full name">
                        <small class="error-message" id="signup-name-error"></small>
                    </div>
                    <div class="form-group">
                        <label for="signup-email">Email</label>
                        <input type="email" id="signup-email" placeholder="Enter your email">
                        <small class="error-message" id="signup-email-error"></small>
                    </div>
                    <div class="form-group">
                        <label for="signup-password">Password</label>
                        <input type="password" id="signup-password" placeholder="Create a password">
                        <small class="error-message" id="signup-password-error"></small>
                    </div>
                    <div class="form-group">
                        <label for="signup-confirm-password">Confirm Password</label>
                        <input type="password" id="signup-confirm-password" placeholder="Confirm your password">
                        <small class="error-message" id="signup-confirm-password-error"></small>
                    </div>
                    <button type="submit" class="submit-btn">Sign Up</button>
                </form>

                <!-- Divider -->
                <div class="auth-divider">
                    <span>Or</span>
                </div>

                <!-- Social Login Buttons -->
                <div class="social-login">
                    <button class="social-btn google-btn">
                        <i class="fab fa-google"></i> Login with Google
                    </button>
                    <button class="social-btn facebook-btn">
                        <i class="fab fa-facebook-f"></i> Login with Facebook
                    </button>
                    <!-- Add more social buttons if needed -->
                </div>
            </div>
        </div>
    </main>

    <!-- Footer (Optional for auth page, but can be included) -->
    <footer>
         <div class="footer-content">
            <div class="footer-info">
                <h4>Book Haven</h4>
                <p>&copy; 2026 Book Haven. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- Link JS -->
    <script src="script.js"></script>
    <script src="auth.js"></script>
</body>
</html>
